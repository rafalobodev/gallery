<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gallery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="img/icon/pic.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css">
    <link rel='stylesheet' href='https://fonts.googleapis.com/css?family=Playfair+Display:700|Raleway:500.700'>
    <link rel="stylesheet" href="./css/style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css"
        integrity="sha512-HK5fgLBL+xu6dm/Ii3z4xhlSUyZgTT9tuc/hSrtw6uzJOvgRr2a9jyxxT1ely+B+xFAmJKVSTbpM/CuL7qxO8w=="
        crossorigin="anonymous" />
</head>

<body>
    <header class="header">
        <a href="" class="header-brand">Gallery</a>
        <nav class="header-navbar">
            <ul>
                <li><a href="#" class="active">Home</a></li>
                <li><a target="_blank" href="https://rafaellinolobo-portfolio.netlify.app/">Portifolio</a></li>
                <li><a target="_blank" href="https://rafaellinolobo-portfolio.netlify.app/#Projects">Projects</a></li>
                <li><a target="_blank" href="https://rafaellinolobo-portfolio.netlify.app/#contact">Contact</a></li>
                <li><a target="_blank" href="https://rafaellinolobo-portfolio.netlify.app/#about">About</a></li>
            </ul>
        </nav>
        <div class="header-social-media">
            <ul>
                <li><a href="https://www.linkedin.com/in/rafael-lino-lobo-097b121b5/"><i
                            class="fab fa-linkedin"></i></a></li>
                <li><a href="https://github.com/rafalobodev"><i class="fab fa-github"></i></a></li>
                <li><a href="https://www.instagram.com/_rafa.lobo_/"><i class="fab fa-instagram"></i></a></li>
                <li><a href="https://twitter.com/losfodo"><i class="fab fa-twitter"></i></a></li>
                <li><a href="https://rafaellinolobo-portfolio.netlify.app/"><i class="fab fa-usb"></i></a></li>
            </ul>
        </div>
    </header>

    <div class="underline-home"></div>

    <main>
        <div class="gallery">
            <div class="gallery-card" id="card-1">
                <h2 class="gallery-card-title">Art</h2>
                <a href="#app" class="gallery-card-btn">⬇︎More photos</a>
            </div>
            <div class="gallery-card" id="card-2">
                <h2 class="gallery-card-title">Places</h2>
                <a href="#app" class="gallery-card-btn">⬇︎More photos⬇︎</a>
            </div>
            <div class="gallery-card" id="card-3">
                <h2 class="gallery-card-title">Styles</h2>
                <a href="#app" class="gallery-card-btn">More photos⬇︎</a>
            </div>
        </div>
    </main>

    <div class="underline-title"></div>

    <!-- Galeria Dinâmica -->
    <div id="app" class="container">
        <card v-for="item in items" :key="item.id" :data-image="item.image">
            <h1 slot="header">{{ item.title }}</h1>
            <p slot="content">{{ item.description }}</p>
        </card>
    </div>

    <div class="underline-title"></div>

    <footer>
        <p>&copy; <span>RafaelLinoLobo</span> - 2020</p>
    </footer>

    <!-- Scripts -->
    <script src='https://cdnjs.cloudflare.com/ajax/libs/vue/2.0.1/vue.min.js'></script>
    <script src="./js/apiGithubfolder.js"></script>
    <!-- <script src="./js/card.js"></script> -->
</body>

</html>
